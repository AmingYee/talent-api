services:
  talent-api:
    build: .
    container_name: talent-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./talent.db
      - ENVIRONMENT=production
      - DEBUG=False
    volumes:
      - ./talent.db:/app/talent.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - talent-network

networks:
  talent-network:
    driver: bridge
